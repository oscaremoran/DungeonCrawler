<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<canvas id="game"></canvas><div id="hud"></div><div id="loader"></div>
<script src="game.js"></script>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
  while(!window.GAME) await wait(40);
  const g=window.GAME, p=g.player; g.fade=0; g.introShown=true;
  const which=location.hash.slice(1)||"map";
  if(which==="map"){ g.state="overworld"; const lg=g.world; p.x=(lg.lizards?22:22)*48; p.y=13*48; g.encounterCD=99999; }
  else if(which==="skills"){ p.lv=10; p.maxmp=20; p.mp=20; p.skills=["heal","fire"]; g.state="overworld"; g.ui={screen:"skills",sel:0,drag:null,hover:-1}; }
  else if(which==="bskill"){ p.lv=10; p.mp=20; p.maxmp=20; p.skills=["fire","bolt","heal"]; g.enterBattle(g.lizards[0]); g.battle.phase="submenu"; g.battle.sub={type:"skill",sel:0,list:["fire","bolt","heal"]};
    setInterval(()=>{ g.battle.phase="submenu"; },50); }
  else if(which==="victory"){ g.enterBattle(g.lizards[0]); g.grantRewards(); const b=g.battle; b.phase="victory"; b.victoryT=600; setInterval(()=>{b.phase="victory";},50); }
  else if(which==="levelup"){ p.exp=p.expNext-1; g.enterBattle(g.lizards[0]); g.grantRewards(); const b=g.battle; b.phase="levelup"; b.levelT=1600; setInterval(()=>{b.phase="levelup";},50); }
})();
</script></body></html>
